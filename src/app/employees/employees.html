<div class="card">
    <p-toast />
    <p-table [value]="products" dataKey="id" editMode="row" [tableStyle]="{'min-width': '50rem'}"
    [columns]="columns" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[5, 10, 20]" [responsiveLayout]="'scroll'">
        <ng-template #header let-columns>
         <tr>
            @for(col of columns; track col.field){
             <th>
                {{col.header}}   
             </th>
            }
            <th>Actions</th>
         </tr>
        </ng-template>
        <ng-template #body let-product let-editing="editing" let-ri="rowIndex">
            <tr [pEditableRow]="product">
                 @for(col of columns; track col.field){
                <td>
                   
                    <p-cellEditor>
                        <ng-template #input>
                            <input
                                pInputText type="text"
                                [(ngModel)]="product[col.field]" />
                        </ng-template>
                        <ng-template #output>
                            {{product[col.field]}}
                        </ng-template>
                    </p-cellEditor>
                  
                </td>
                 }
                <td>
                 <div class="action-buttons">
                @if(!editing){
                <button
                    pButton
                    type="button"
                    pInitEditableRow
                    icon="pi pi-pencil"
                    (click)="onRowEditInit(product)"
                ></button>
                <button
                    pButton
                    type="button"
                    pCancelEditableRow
                    icon="pi pi-times"
                    (click)="onRowEditCancel(product, ri)"
                ></button>
                }
                @if(editing){
                <button
                    pButton
                    type="button"
                    pSaveEditableRow
                    icon="pi pi-check"
                    (click)="onRowEditSave(product)"
                ></button>
                }
                
                 </div>
                </td>
                 
            </tr>
        </ng-template>
    </p-table>
</div>
